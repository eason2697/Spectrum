<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="public/assets/spectrum-logo.png">
    <link rel="shortcut icon" type="image/x-icon" href="public/assets/favicon.ico">

    <title>政治思想工具箱 | Political Spectrum Toolbox</title>
    <meta name="description" content="一個視覺化的政治光譜互動地圖，探索各類政治思想、歷史人物與政黨的象限坐標。">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eason2697.github.io/Spectrum/">
    <meta property="og:title" content="政治思想工具箱 | Political Spectrum Toolbox">
    <meta property="og:description" content="一個視覺化的政治光譜互動地圖，探索各類政治思想、歷史人物與政黨的象限坐標。">
    <meta property="og:image" content="https://eason2697.github.io/Spectrum/public/assets/og-cover.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://eason2697.github.io/Spectrum/">
    <meta name="twitter:title" content="政治思想工具箱 | Political Spectrum Toolbox">
    <meta name="twitter:description" content="一個視覺化的政治光譜互動地圖，探索各類政治思想、歷史人物與政黨的象限坐標。">
    <meta name="twitter:image" content="https://eason2697.github.io/Spectrum/public/assets/og-cover.png">

    <link rel="stylesheet" href="./public/style.css">
    <style>
        /* 屏蔽手機連點放大，提升點擊反應速度並防止意外縮放 */
        html, body {
            touch-action: manipulation;
        }

        /* 側邊欄與按鈕佈局補丁 */
        .app-sidebar {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* 防止側邊欄本身出現雙重滾動條 */
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto; /* 內容區啟用滾動 */
            overflow-x: hidden;
            scrollbar-width: thin;
        }
        /* 確保按鈕永遠可見 */
        .sidebar-toggle {
            position: fixed !important;
            top: 10px;
            left: 10px;
            z-index: 9999; /* 絕對最高層級 */
            transition: all 0.3s ease;
        }
        /* 讓標題具備按鈕特性 */
        .sidebar-brand {
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .sidebar-brand:hover {
            opacity: 0.8;
        }

        /* 測驗回答按鈕響應式佈局：手機預設直列，大螢幕橫列 */
        .quiz-options {
            display: flex !important;
            flex-direction: column; /* 手機版預設直列 */
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin: 30px auto;
            justify-content: center;
        }

        .quiz-options .btn {
            width: 100% !important;
            min-height: 50px;
            padding: 12px !important;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 !important;
        }

        /* 平板與電腦版 (寬度 > 768px) 切換回橫向 */
        @media (min-width: 769px) {
            .quiz-options {
                flex-direction: row; /* 橫向排列 */
                max-width: 900px;
                gap: 8px;
            }
            .quiz-options .btn {
                flex: 1; /* 平分空間 */
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 側邊欄開關按鈕移至外部，確保位置固定不隨側邊欄收合而消失 -->
        <button class="sidebar-toggle" id="sidebar-toggle-btn">
            <span class="icon-open">☰</span>
            <span class="icon-close">&times;</span>
        </button>

        <!-- 全域共用側邊欄 -->
        <div id="app-sidebar" class="app-sidebar">
            <div class="sidebar-content">
                <div class="sidebar-brand" data-view="home-view">
                    <svg class="sidebar-logo" viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
                    <h2 data-i18n="siteTitle">政治思想光譜</h2>
                </div>

                <!-- 新增：控制列 (語系與 GitHub) -->
                <div class="sidebar-controls" style="padding: 0 20px 15px; display: flex; gap: 10px;">
                    <button id="lang-toggle-btn" class="btn-mini-tool">EN / 中文</button>
                    <a href="https://github.com/eason2697/Spectrum" target="_blank" class="btn-mini-tool github-link" title="GitHub Source">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                    </a>
                </div>
                
                <!-- 新增篩選區塊 -->
                <div id="sidebar-filter-section" class="sidebar-filter-section" style="display: none;">
                    <h3 class="filter-title" data-i18n="filterTitle">探索篩選</h3>
                    <div id="filter-tags" class="filter-tags"></div>
                    <div class="sidebar-toggle-section">
                        <label class="toggle-container">
                            <input type="checkbox" id="toggle-community-points" checked data-action="toggle-community">
                            <span class="toggle-label" data-i18n="toggleCommunity">顯示群體落點分析</span>
                        </label>
                    </div>
                    <div class="sidebar-toggle-section">
                        <label class="toggle-container">
                            <input type="checkbox" id="toggle-figures" checked data-type="figure" class="filter-checkbox">
                            <span class="toggle-label" data-i18n="toggleFigures">顯示歷史人物</span>
                        </label>
                    </div>
                    <div class="sidebar-toggle-section">
                        <label class="toggle-container">
                            <input type="checkbox" id="toggle-parties" checked data-type="party" class="filter-checkbox">
                            <span class="toggle-label" data-i18n="toggleParties">顯示當代政黨</span>
                        </label>
                    </div>
                </div>

                <div class="sidebar-nav">
                    <button id="sidebar-btn-home" class="btn-sidebar" data-view="home-view" style="display: none;">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span data-i18n="homeBtn">回首頁</span>
                    </button>
                    <button id="sidebar-btn-map" class="btn-sidebar" data-view="map-view">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
                        <span data-i18n="mapBtn">查看地圖</span>
                    </button>
                    <button id="sidebar-btn-quiz" class="btn-sidebar">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <span data-i18n="quizBtn">進入測驗</span>
                    </button>
                    <button id="sidebar-btn-share" class="btn-sidebar">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                        <span data-i18n="shareBtn">分享網站</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 首頁 -->
        <div id="home-view" class="view active">
            <div class="home-container">
                <div class="home-header">
                    <h1 data-i18n="siteTitle">政治思想工具箱</h1>
                    <p data-i18n="siteSubTitle">探索、測驗並分析各種政治意識形態</p>
                </div>
                <section id="app-grid" class="app-grid"></section>
            </div>
        </div>

        <!-- 測驗 -->
        <div id="quiz-view" class="view">
            <div id="progress-container"><div id="progress-fill"></div></div>
            <div id="quiz-container"></div>
        </div>

        <!-- 測驗結果 -->
        <div id="result-view" class="view">
            <div id="result-box">
                <h2 data-i18n="resultTitle">測驗結果</h2>
                <p style="font-size: 1.1rem;"><span data-i18n="closestMatch">最貼近您的政治思想是：</span><br><strong id="closest-ideology" class="result-highlight"></strong></p>
                <div id="top-ideologies-list" style="margin: 15px auto; padding: 15px; background: var(--map-bg); border: 1px solid var(--border-color); border-radius: 8px; text-align: left; display: inline-block; width: 100%; max-width: 300px;"></div>
                
                <div class="result-score-container">
                    <p><span data-i18n="ecoLabel">經濟傾向 (左 - 右)</span> <span id="score-x"></span></p>
                    <div class="score-bar eco-bar"><div id="score-x-marker" class="score-marker"></div></div>
                </div>
                <div class="result-score-container">
                    <p><span data-i18n="polLabel">政治傾向 (自由 - 威權)</span> <span id="score-y"></span></p>
                    <div class="score-bar pol-bar"><div id="score-y-marker" class="score-marker"></div></div>
                </div>
                <div class="actions">
                    <button id="result-btn-map" class="btn btn-primary" data-view="map-view">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <span data-i18n="viewOnMap">在地圖上查看我的位置</span>
                    </button>
                    <button id="result-btn-home" class="btn btn-secondary" data-view="home-view">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span data-i18n="homeBtn">回首頁</span>
                    </button>
                </div>
                <div class="share-actions">
                    <p data-i18n="shareResult">分享你的結果：</p>
                    <button class="btn btn-share" data-platform="threads">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>
                        Threads
                    </button>
                    <button class="btn btn-share" data-platform="line">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        Line
                    </button>
                    <button class="btn btn-share" data-platform="ig">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        <span data-i18n="shareIGText">IG / 複製文本</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 地圖 -->
        <div id="map-view" class="view">
            <!-- Map container takes up the main space -->
            <div id="map-container">
                <div id="map-area">
                    <!-- 坐標軸標籤移動至地圖區域內，以維持比例參考的一致性 -->
                    <!-- 新增：全網數據畫布層，放置於軸線下方，背景上方 -->
                    <canvas id="community-canvas" width="3000" height="3000"></canvas>
                    
                    <span class="axis-label top" data-i18n="axisAuth">威權 (收緊)</span>
                    <span class="axis-label bottom" data-i18n="axisLib">自由 (放寬)</span>
                    <span class="axis-label left" data-i18n="axisLeft">社會主義 (左)</span>
                    <span class="axis-label right" data-i18n="axisRight">資本主義 (右)</span>
                </div>
                
                <!-- 地圖搜尋框 -->
                <div class="map-search-box">
                    <input type="text" id="map-search-input" placeholder="搜尋政治思想..." autocomplete="off">
                    <div id="map-search-results" class="search-results"></div>
                </div>

                <!-- 地圖控制按鈕 -->
                <div class="map-controls">
                    <button class="map-btn" id="map-zoom-in" data-i18n-title="mapZoomIn">+</button>
                    <button class="map-btn" id="map-zoom-out" data-i18n-title="mapZoomOut">-</button>
                    <button class="map-btn reset-btn" id="map-reset" data-i18n-title="mapResetView" data-i18n="mapReset">重置</button>
                </div>

                <!-- 地圖圖例 -->
                <div class="map-legend">
                    <h4 data-i18n="mapLegendTitle">圖例</h4>
                    <div class="legend-item"><span class="legend-color" style="background: #E2F0D9;"></span><span data-i18n="legendAuthLeft">威權左派</span></div>
                    <div class="legend-item"><span class="legend-color" style="background: #FCE4D6;"></span><span data-i18n="legendAuthRight">威權右派</span></div>
                    <div class="legend-item"><span class="legend-color" style="background: #DDEBF7;"></span><span data-i18n="legendLibLeft">自由左派</span></div>
                    <div class="legend-item"><span class="legend-color" style="background: #FFF2CC;"></span><span data-i18n="legendLibRight">自由右派</span></div>
                    <div class="legend-item"><span class="legend-dot ideology"></span><span data-i18n="legendIdeologyPoint">政治思想點</span></div>
                    <div class="legend-item"><span class="legend-dot user"></span><span data-i18n="legendYourLocation">你的位置</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 地圖彈窗 -->
    <div id="ideology-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="modal-close-btn">&times;</span>
            <h3 id="modal-title"></h3>
            <span id="modal-category" class="category-tag"></span>
            <div id="modal-image-slot" class="modal-image-slot">
                <img id="modal-image" src="" alt="Representative Image">
            </div>
            <p><strong data-i18n="coreIdeology">核心理念：</strong><span id="modal-desc"></span></p>
            <p><strong data-i18n="historyBack">歷史背景：</strong><span id="modal-history"></span></p>
            <p><span data-i18n="scoreX">經濟評分</span>：<span id="modal-score-x"></span></p>
            <p><span data-i18n="scoreY">政治評分</span>：<span id="modal-score-y"></span></p>
            <button class="btn btn-primary mt-3" id="modal-search-btn" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span data-i18n="searchGoogle">在網路上搜尋</span>
            </button>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
